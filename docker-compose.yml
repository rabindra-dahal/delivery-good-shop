version: '3.8'

services:
  grocery-shop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_api_service
    ports:
      - "8000:8000"
    volumes:
      # Creates a specialized 'data' directory on your machine to lock down SQLite persistence
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:////app/data/shop.db
      - SECRET_KEY=supersecretkey123_production_grade_32_byte_minimum_string
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    restart: unless-stopped

# Commands to manage your ecosystem:
# Start services backgrounded:   docker-compose up -d
# Check running status logs:     docker-compose logs -f
# Stop container ecosystem:      docker-compose down
